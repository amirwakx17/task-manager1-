services:
  - type: web
    name: taskmanager787-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: BOT_TOKEN
        sync: false
      - key: WEB_ACCESS_KEY
        sync: false
      - key: WEB_USER_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
